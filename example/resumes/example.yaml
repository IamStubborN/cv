coverLetter:
  fileName: Alex_Morgan_Cover_Letter.pdf
  greeting: "Dear Hiring Team,"
  paragraphs:
    - "I am a Senior Backend Engineer with more than ten years of experience building reliable distributed systems for SaaS, logistics, and financial technology products. I am interested in joining a team where backend engineering is treated as a product discipline: grounded in customer outcomes, thoughtful system design, measurable reliability, and sustainable delivery."
    - "At Northstar Cloud, I lead backend work across billing, identity, and reporting for a platform serving more than 4,000 organizations. I have designed Go services handling over 35 million daily requests, helped maintain 99.99% availability, reduced failed billing transactions by 72%, and lowered annual infrastructure costs by approximately $240,000. I remain hands-on throughout the lifecycle, from architecture and implementation to observability, incident response, and continuous improvement."
    - "My strongest contributions come at the intersection of technical depth and practical collaboration. I enjoy turning ambiguous requirements into clear service boundaries and dependable delivery plans, while helping other engineers grow through design reviews, pairing, documentation, and direct feedback. I care about simple interfaces, explicit failure modes, useful tests, and operational signals that make systems easier to own."
    - "I would welcome the opportunity to discuss how my experience with Go, TypeScript, PostgreSQL, Kafka, Kubernetes, and cloud infrastructure could help your team build and operate dependable products at scale. Thank you for your time and consideration."
  closing: "Best regards,"
